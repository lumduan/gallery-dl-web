# Dependency update automation.
#
# Added after four GitHub Actions were found 3-7 majors behind — `actions/checkout` and
# `actions/setup-node` at v4 against v7, `actions/upload-artifact` at v4 against v7, and
# `astral-sh/setup-uv` at v3 against v10 — which the runners had been warning about (Node 20
# deprecation) on every single job. Nothing was watching, so nothing moved.
#
# **Minor and patch updates are grouped per ecosystem; majors deliberately are not.** A major is
# where the breaking change lives and it deserves its own PR carrying its own release notes: the
# setup-uv jump alone crossed a changed `enable-cache` default (v5), a changed
# `cache-dependency-glob` default and two removed inputs (v6), the Node 24 move (v7), a removed
# manifest format (v8), a changed `prune-cache` default (v9) and a new cache-poisoning guard (v10).
# Grouped into one PR with six other bumps, none of that gets read.
version: 2
updates:
  # ---- CI workflows ---------------------------------------------------------------------------
  # The ecosystem that motivated this file. Note Dependabot only tracks actions referenced by a
  # version ref, which is why `astral-sh/setup-uv` is pinned to an exact `v10.0.1` in the workflows
  # (that action stopped publishing floating major tags after v7, so there is no `@v10` to follow).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- Backend (uv) ---------------------------------------------------------------------------
  # `uv` is its own ecosystem in dependabot-core (registered as "uv", labelled `python:uv`); the
  # `pip` ecosystem does not read `uv.lock`. It covers backend/pyproject.toml + backend/uv.lock.
  # Runtime and dev deps are grouped separately: only the runtime closure ships in the image, and
  # `security.yml` gates on exactly that set while treating the dev toolchain as informational.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      backend-runtime:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      backend-dev:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- Frontend (npm) -------------------------------------------------------------------------
  # Next.js/React majors stay ungrouped on purpose: frontend/AGENTS.md exists precisely because
  # this Next version already departs from what a model has memorised, and a major moves that
  # target again.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # `@types/node` must track the NODE RUNTIME, never npm latest -- it is a description of the
      # runtime's API surface, not a library. Types *behind* the runtime are harmless (tsc simply
      # doesn't know about newer APIs); types *ahead* of it are a trap, because `npm run typecheck`
      # green-lights calls that then throw inside node:24-alpine, and CI cannot catch it -- it
      # typechecks under `node-version: 24` using whatever types are installed.
      #
      # It moves when Node does, in the same commit. See the node ignore under `docker` below.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # BLOCKED UPSTREAM, not by us. `typescript-eslint@8.65.0` declares
      # `peerDependencies.typescript: ">=4.8.4 <6.1.0"` and hard-throws
      # `"typescript-eslint does not support TS 7.0."` before a single file is linted, so `npm run
      # lint` exits 2 and `typecheck`/`build` never even run. Its own error points at
      #   typescript-eslint/typescript-eslint#10940
      #   "Enhancement: Use TS 7 (tsgo / typescript-go) for type information"
      # ⚠️ This ignore is BROADER than the block: the peer range would accept a TS 6.0.x major.
      # Lifting it is a deliberate check that typescript-eslint has shipped support, not an
      # automatic follow-on. (Was PR #16.)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # ALSO BLOCKED UPSTREAM, and further out than it looks. ESLint 10 removed the legacy context
      # API, and `eslint-plugin-react` still calls `context.getFilename()`:
      #   TypeError: Error while loading rule 'react/display-name':
      #             contextOrFilename.getFilename is not a function
      # This is NOT a stale `eslint-config-next` -- 16.3.2 asks for `eslint-plugin-react: ^7.37.0`
      # and 7.37.5 IS the latest, released 2025-04-03, with peers `eslint: ^3 || ... || ^9.7`.
      # ESLint 10 has never been in its supported range, so nothing downstream can route around it;
      # verified by installing eslint@10 locally against eslint-config-next 16.3.2 and reproducing
      # the identical failure. Tracking:
      #   jsx-eslint/eslint-plugin-react#4022 "fix: complete ESLint 10 compatibility" (PR, open)
      #   jsx-eslint/eslint-plugin-react#4027 "chore: Remove ESLint 10 peer dependency overrides"
      # (Was PR #17.)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- pre-commit hooks -----------------------------------------------------------------------
  # Note the ecosystem value is "pre-commit" with a HYPHEN. dependabot-core's directory is
  # `pre_commit` and it registers internally as `pre_commit`, but the YAML value is the hyphenated
  # form -- the same split as `github_actions` -> `github-actions`. It is in the standard enum, so
  # it needs no `enable-beta-ecosystems`.
  #
  # WHY THIS MATTERS HERE: backend/.pre-commit-config.yaml pins its own ruff, independently of
  # pyproject.toml, and it had diverged badly -- the hooks sat on ruff v0.6.9 and mypy v1.11.2 while
  # uv.lock resolved 0.15.22 and 2.3.0, a full major apart. A green pre-commit run therefore said
  # nothing about whether CI would pass, which is the opposite of what a pre-commit hook is for.
  #
  # ⚠️ Dependabot reduces that drift but cannot close it: it moves the hook rev toward latest and
  # uv.lock within what pyproject.toml allows, with no idea the two should agree. The closing move
  # is `backend/tests/test_hook_pins.py`, which fails whenever they disagree -- so the hook bump and
  # the matching uv.lock bump have to land in ONE commit, since they arrive here as separate PRs
  # (different ecosystems) and GitHub cannot merge PRs atomically.
  #
  # mypy is deliberately absent from all of this: it is a `repo: local` hook running
  # `uv run --directory backend mypy src`, the exact command ci.yml runs, so it has no version for
  # Dependabot to track and cannot drift by construction.
  - package-ecosystem: "pre-commit"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-dev)"
    groups:
      pre-commit-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- Container base images ------------------------------------------------------------------
  # backend/Dockerfile: ghcr.io/astral-sh/uv:python3.12-bookworm-slim + python:3.12-slim
  # frontend/Dockerfile: node:24-alpine
  # A `python:3.13-slim` PR will show up eventually and should NOT be merged on its own — the 3.12
  # pin is load-bearing against `requires-python` in pyproject.toml and `uv python install 3.12` in
  # ci.yml. Treat it as a prompt to move all three together, not as a routine bump.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Node 24 is the ACTIVE LTS line (LTS since 2025-10-28, EOL 2028-04-30). Node 26 is still
      # `Current` and does not enter LTS until **2026-10-28**, so bumping now would put the shipped
      # image on a non-LTS release for two months. Verified against nodejs/Release/schedule.json.
      #
      # It is also not a one-file change: Node 24 is pinned in FIVE places that have to move
      # together -- frontend/Dockerfile (x3), .github/workflows/ci.yml `node-version`,
      # docker-compose.dev.yml, frontend/package.json `@types/node`, plus the prose in README.md and
      # CLAUDE.md. A lone Dockerfile bump would leave CI testing on 24 while the image ran 26.
      #
      # ⏰ REVISIT 2026-10-28, and move all of them in one commit.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      base-images-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- Compose files (repo root) ---------------------------------------------------------------
  # The `docker` entry above is scoped to /backend and /frontend, so it cannot see the compose files
  # at the repo root -- docker-compose.dev.yml:59 pins `node:24-alpine` and was invisible to
  # Dependabot entirely. That is exactly how dev and prod drift apart silently.
  #
  # docker-compose.yml's own images are this project's ghcr releases, which are published by
  # docker-publish.yml on a `v*` tag rather than tracked here.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Same coupling and the same revisit date as the Dockerfile above.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
