repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy is a LOCAL hook running the project's own environment, not a pinned mirror, and that is
  # deliberate on two counts.
  #
  # 1. A mirrored hook installs mypy in an isolated venv. With `additional_dependencies: []` it
  #    could not see fastapi, so `--strict` reported 34 `untyped-decorator` errors on every
  #    `@router.get` — the hook was only ever "green" because its `files: ^src/` matched nothing
  #    (pre-commit passes paths relative to the GIT ROOT, so they are `backend/src/...`; 36 files
  #    match `^backend/src/`, 0 match `^src/`). It reported "no files to check / Skipped" on every
  #    run, which reads as success. Listing every runtime dependency in `additional_dependencies`
  #    would fix that by duplicating uv.lock — a second source of truth that drifts.
  #
  # 2. It runs the EXACT command ci.yml runs, in the same environment, reading the same
  #    `[tool.mypy]` config. There is no version to keep in step, so it cannot drift by
  #    construction — strictly stronger than tests/test_hook_pins.py's version comparison, which is
  #    why mypy is not in that check's COUPLED table.
  #
  # `--directory backend` because pre-commit runs from the git root. `pass_filenames: false`
  # because mypy needs the whole package for inference, exactly as CI invokes it.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (backend/src, project env)
        entry: uv run --directory backend mypy src
        language: system
        pass_filenames: false
        files: ^backend/src/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
